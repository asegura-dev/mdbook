<!DOCTYPE html>
<html lang="en" data-theme="{{DEFAULT_THEME}}" data-default-theme="{{DEFAULT_THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{STYLE}}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="Menu">&#9776;</button>
  <span class="topbar-title">{{TITLE}}</span>
  <input type="search" class="search" placeholder="Search…" aria-label="Search" autocomplete="off">
  {{THEME_PICKER}}
  <button class="icon-btn notes-btn" type="button" aria-label="Notes and highlights">Notes<span class="notes-count"></span></button>
  <button class="icon-btn print-btn" type="button" aria-label="Export to PDF">PDF</button>
</header>

<div class="ann-bar" hidden>
  <button class="ann-color" type="button" data-color="yellow" aria-label="Highlight yellow"></button>
  <button class="ann-color" type="button" data-color="green" aria-label="Highlight green"></button>
  <button class="ann-color" type="button" data-color="pink" aria-label="Highlight pink"></button>
  <button class="ann-note-btn" type="button">Note</button>
</div>

<div class="ann-pop" hidden>
  <div class="ann-pop-colors">
    <button class="ann-color" type="button" data-color="yellow" aria-label="Yellow"></button>
    <button class="ann-color" type="button" data-color="green" aria-label="Green"></button>
    <button class="ann-color" type="button" data-color="pink" aria-label="Pink"></button>
  </div>
  <textarea class="ann-pop-note" rows="3" placeholder="Write a note…"></textarea>
  <div class="ann-pop-actions">
    <button class="ann-pop-save" type="button">Save</button>
    <button class="ann-pop-delete" type="button">Delete</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" aria-label="Navigation">
    {{SIDEBAR}}
  </nav>
  <div class="backdrop"></div>
  <main class="content">
    {{CONTENT}}
  </main>
</div>

<!-- Last in the document on purpose: on screen it is a fixed drawer, so its
     position here does not matter, but in print it becomes the appendix and an
     appendix belongs at the end. -->
<aside class="review" aria-label="Notes and highlights" hidden data-count="0">
  <header class="review-head">
    <strong>Notes &amp; highlights</strong>
    <button class="icon-btn review-close" type="button" aria-label="Close">&times;</button>
  </header>
  <div class="review-actions">
    <button class="review-copy" type="button">Copy as Markdown</button>
    <button class="review-download" type="button">Download .md</button>
  </div>
  <div class="review-list"></div>
</aside>
<script>
{{SCRIPT}}
</script>
</body>
</html>
