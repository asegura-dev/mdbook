# Runs the four gates docs/06-extending.md §3 already asks contributors to run
# before calling a change done: ruff check, ruff format --check, mypy, pytest.
# The list is deliberately the same one — a CI that checks something different
# from the documented workflow just teaches people to ignore it.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock drifted from pyproject.toml, so the lock file
      # stays trustworthy instead of quietly rotting.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types (strict)
        run: uv run mypy

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The engine is pure Python, but the product ships as a Windows .exe.
        # Testing only on Linux would leave the platform users actually run
        # unverified; path and encoding bugs are exactly what differs.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
